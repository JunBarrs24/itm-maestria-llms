<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Facturio Soporte</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --navy:#1f2a44; --teal:#0e7c7b; --orange:#d9822b; --gray:#6b7280; --light:#f3f4f6; --text:#111827; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; color:var(--text); background:#fff; }
  header { background:var(--navy); color:#fff; padding:8px 16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  header label { font-size:12px; display:flex; gap:5px; align-items:center; }
  header select, header input[type=checkbox] { font-size:12px; }
  header .cfg { margin-left:auto; font-size:12px; color:#cfe6e5; }
  main { display:grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 56px); }
  #chat { display:flex; flex-direction:column; border-right:1px solid #e5e7eb; }
  #mensajes { flex:1; overflow:auto; padding:16px; }
  .msg { max-width:85%; padding:10px 12px; border-radius:10px; margin:6px 0; white-space:pre-wrap; line-height:1.35; }
  .user { background:#e6f4f3; margin-left:auto; }
  .bot { background:var(--light); }
  .meta { font-size:11px; color:var(--gray); margin-top:4px; }
  #entrada { display:flex; gap:8px; padding:12px; border-top:1px solid #e5e7eb; }
  #entrada input { flex:1; padding:10px; font-size:14px; border:1px solid #d1d5db; border-radius:8px; }
  #entrada button { padding:10px 16px; background:var(--teal); color:#fff; border:0; border-radius:8px; cursor:pointer; }
  #panel { overflow:auto; padding:12px 16px; background:#fafafa; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .tabs button { padding:6px 10px; border:1px solid #d1d5db; background:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
  .tabs button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .paso { border-left:4px solid var(--teal); background:#fff; padding:8px 10px; margin:8px 0; border-radius:6px; font-size:13px; }
  .paso.modelo { border-color:var(--navy); } .paso.tool { border-color:var(--orange); } .paso.aviso { border-color:#b43c3c; }
  .paso.routing, .paso.contexto { border-color:var(--gray); }
  .paso.guardrail { border-color:#7c3aed; } .paso.handoff, .paso.modo { border-color:#2563eb; } .paso.skill { border-color:#059669; }
  .paso b { display:block; margin-bottom:4px; }
  pre { background:var(--light); padding:8px; border-radius:6px; overflow:auto; font-size:12px; margin:6px 0 0; }
  .vacio { color:var(--gray); font-size:13px; }
  .ejemplos { display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 8px; }
  .ejemplos button { font-size:12px; padding:4px 8px; border:1px solid #d1d5db; background:#fff; border-radius:12px; cursor:pointer; }
  .aprobacion { border:2px solid var(--orange); background:#fff7ed; padding:10px 12px; border-radius:10px; margin:8px 0; font-size:13px; }
  .aprobacion button { margin:6px 6px 0 0; padding:6px 12px; border:0; border-radius:6px; cursor:pointer; color:#fff; }
  .aprobacion .si { background:var(--teal); } .aprobacion .no { background:#b43c3c; }
</style>
</head>
<body>
<header>
  <h1>Facturio Soporte</h1>
  <label>Diseño <select id="diseno"></select></label>
  <label>Proveedor <select id="proveedor"></select></label>
  <label>Contexto
    <select id="estrategia">
      <option value="completo">A. historial completo</option>
      <option value="ventana">B. ventana (6 msgs)</option>
      <option value="estado" selected>C. estado estructurado</option>
    </select>
  </label>
  <label>Effort <select id="effort"></select></label>
  <label>Compresor <select id="compresor"></select></label>
  <label><input type="checkbox" id="side_effects"> side effects automáticos</label>
  <label><input type="checkbox" id="stream"> streaming (SSE)</label>
  <button id="reiniciar" style="font-size:12px">reiniciar sesión</button>
  <span class="cfg" id="cfg"></span>
</header>
<main>
  <section id="chat">
    <div id="mensajes"></div>
    <div class="ejemplos" id="ejemplos"></div>
    <form id="entrada">
      <input id="texto" autocomplete="off" placeholder="Escribe como cliente de Facturio…">
      <button>Enviar</button>
    </form>
  </section>
  <section id="panel">
    <div class="tabs">
      <button data-tab="trace" class="on">Trace</button>
      <button data-tab="contexto">Contexto enviado</button>
      <button data-tab="estado">Estado de la app</button>
      <button data-tab="razonamiento">Razonamiento</button>
      <button data-tab="uso">Uso y costo</button>
    </div>
    <div id="contenido"><p class="vacio">Envía un mensaje. Aquí aparece lo que la aplicación hizo con él.</p></div>
  </section>
</main>
<script>
const sesionId = Math.random().toString(36).slice(2);
let ultimo = null, tab = "trace";
const $ = s => document.querySelector(s);
const EJEMPLOS = [
  "Soy el usuario u002, ¿qué plan tengo y cuántas facturas llevo este mes?",
  "Soy u001. Reembolsa el cargo PAY-00012345 completo, no usé el servicio.",
  "Me cobraron dos veces, el cargo es PAY-00012345. Quiero el reembolso.",
  "No me llega el código de dos factores por SMS, ¿cuánto tiempo es válido?",
  "Mi presupuesto máximo es 500 pesos al mes, ¿me conviene el plan Pro?",
  "Escríbeme un poema sobre el clima de Morelia",
];
EJEMPLOS.forEach(t => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => { $("#texto").value = t; }; $("#ejemplos").appendChild(b); });
const NOMBRES_DISENO = { routing: "routing (regex, 1 agente)", modes: "modes (1 agente, cambiar_modo)", handoffs: "handoffs (triage + especialistas)", handoffs_minimo: "handoffs, paquete mínimo" };

function opcion(sel, v, texto, on) { const o = document.createElement("option"); o.value = v; o.textContent = texto; if (on) o.selected = true; sel.appendChild(o); }
fetch("/config").then(r => r.json()).then(c => {
  $("#cfg").textContent = c.modelo;
  c.disenos.forEach(d => opcion($("#diseno"), d, NOMBRES_DISENO[d] || d, d === "routing"));
  c.proveedores.forEach(p => opcion($("#proveedor"), p.nombre, `${p.nombre} · ${p.modelo}`, p.nombre === "openai"));
  c.efforts.forEach(e => opcion($("#effort"), e, e + (e === c.effort ? " (.env)" : ""), e === c.effort));
  c.compresores.forEach(e => opcion($("#compresor"), e, e + (e === c.compresor ? " (.env)" : ""), e === c.compresor));
});

function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function agregar(rol, texto, meta) {
  const d = document.createElement("div"); d.className = "msg " + rol; d.appendChild(document.createTextNode(texto));
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
  $("#mensajes").appendChild(d); $("#mensajes").scrollTop = 1e9; return d;
}
function tarjetaAprobacion() {
  const items = ultimo && ultimo.aprobacion_pendiente;
  if (!items) return "";
  return `<div class="aprobacion"><b>Aprobación pendiente (human-in-the-loop)</b><br>El SDK detuvo la corrida antes de ejecutar: ${items.map(i => `<code>${esc(i.tool)}(${esc(JSON.stringify(i.args))})</code>`).join(", ")}.<br>La decisión es de la aplicación, no del modelo.<br><button class="si" onclick="decidir(true)">Aprobar</button><button class="no" onclick="decidir(false)">Rechazar</button></div>`;
}
let decidiendo = false;
async function decidir(ok) {
  if (decidiendo) return;
  decidiendo = true;
  document.querySelectorAll(".aprobacion button").forEach(b => { b.disabled = true; if (ok === b.classList.contains("si")) b.textContent = "procesando…"; });
  const r = await fetch(`/aprobar?sesion_id=${sesionId}&decision=${ok}`, { method: "POST" });
  ultimo = await r.json();
  if (ultimo.error) agregar("bot", "Error: " + ultimo.error);
  else agregar("bot", ultimo.respuesta, `${ok ? "aprobado" : "rechazado"} por una persona · ${ultimo.uso.latencia_s}s · $${ultimo.uso.costo_usd}`);
  decidiendo = false; render();
}
function pie(r) { return `${r.diseno} → ${r.ruta} · ${r.proveedor} ${r.modelo} · effort ${r.effort} · ${r.uso.latencia_s}s · ${r.uso.input_tokens + r.uso.output_tokens} tokens (${r.uso.reasoning_tokens} de razonamiento) · $${r.uso.costo_usd}`; }
function render() {
  const c = $("#contenido");
  if (!ultimo) { c.innerHTML = '<p class="vacio">Envía un mensaje.</p>'; return; }
  if (ultimo.error) { c.innerHTML = `<div class="paso aviso"><b>Error</b>${esc(ultimo.error)}</div>`; return; }
  if (tab === "trace") {
    c.innerHTML = tarjetaAprobacion() + ultimo.trace.map(p => {
      if (p.tipo === "routing") return `<div class="paso routing"><b>Diseño ${esc(p.diseno)} → ${esc(p.ruta)} · ${esc(p.proveedor)} ${esc(p.modelo)}</b>${esc(p.regla)} · tools visibles: ${esc(p.tools_visibles.join(", "))} · side effects automáticos: ${p.side_effects_automaticos ? "sí" : "no"}</div>`;
      if (p.tipo === "contexto") return `<div class="paso contexto"><b>Contexto: ${esc(p.estrategia)}</b>${p.mensajes} mensajes · ~${p.tokens_aprox} tokens</div>`;
      if (p.tipo === "guardrail") return `<div class="paso guardrail"><b>Guardrail ${esc(p.nombre)} · ${p.disparado ? "DISPARADO" : "pasa"}</b>${p.disparado ? "validación determinista; la corrida se corta" : "validación determinista"}</div>`;
      if (p.tipo === "handoff") return `<div class="paso handoff"><b>Handoff ${esc(p.de)} → ${esc(p.a)}</b>otro agente toma el turno</div>`;
      if (p.tipo === "agente") return `<div class="paso handoff"><b>Agente ${esc(p.nombre)}</b>${p.latencia_s}s</div>`;
      if (p.tipo === "modo") return `<div class="paso modo"><b>Cambio de modo ${esc(p.de)} → ${esc(p.a)}</b>el modelo lo decidió; en la siguiente vuelta ve otras instrucciones y otras tools</div>`;
      if (p.tipo === "skill") return `<div class="paso skill"><b>Skill cargado: ${esc(p.nombre)}</b>~${p.tokens_aprox} tokens que solo viajan cuando hacen falta</div>`;
      if (p.tipo === "modelo") return `<div class="paso modelo"><b>Llamada al modelo (vuelta ${p.vuelta})</b>${p.latencia_s}s · in ${p.input_tokens} · out ${p.output_tokens} · razonamiento ${p.reasoning_tokens}${p.pide_tools.length ? " · pide: " + esc(p.pide_tools.join(", ")) : " · responde"}</div>`;
      if (p.tipo === "tool") return `<div class="paso tool"><b>Tool ${esc(p.nombre)} · ${esc(p.decision)}</b>args: ${esc(JSON.stringify(p.args))}<pre>${esc(JSON.stringify(p.resultado, null, 1))}</pre></div>`;
      if (p.tipo === "compresion") return `<div class="paso contexto"><b>Compresión (${esc(p.compresor)}) · ${p.mensajes_resumidos} mensajes → resumen</b>${p.compresor === "llm" ? `una llamada más: in ${p.input_tokens} · out ${p.output_tokens} · ${p.latencia_s}s` : "sin llamada al modelo"}<pre>${esc(p.resumen)}</pre></div>`;
      if (p.tipo === "aviso") return `<div class="paso aviso"><b>Aviso</b>${esc(p.mensaje)}${p.respuesta_bloqueada ? `<pre>${esc(p.respuesta_bloqueada)}</pre>` : ""}</div>`;
      return "";
    }).join("");
  } else if (tab === "contexto") {
    c.innerHTML = `<p class="vacio">Lo que el modelo vio al empezar el turno (${ultimo.contexto_enviado.length} mensajes), además de las instrucciones y las definiciones de tools.</p>` +
      ultimo.contexto_enviado.map(m => `<div class="paso ${m.role === "user" ? "contexto" : "modelo"}"><b>${esc(m.role)}</b>${esc(m.content)}</div>`).join("");
  } else if (tab === "estado") {
    c.innerHTML = `<p class="vacio">APPLICATION STATE ≠ MODEL CONTEXT: esto lo guarda la aplicación; solo entra al modelo con la estrategia C.</p><pre>${esc(JSON.stringify(ultimo.estado, null, 2))}</pre>` + (ultimo.resumen ? `<b>Resumen:</b><pre>${esc(ultimo.resumen)}</pre>` : "");
  } else if (tab === "razonamiento") {
    c.innerHTML = `<p class="vacio">Una entrada por llamada al modelo. La cadena completa viaja cifrada; esto es el resumen que devuelve el proveedor (effort de este turno: ${esc(ultimo.effort)}; con minimal o low muchas llamadas no razonan).</p>` +
      ultimo.razonamiento.map(v => `<div class="paso modelo"><b>Vuelta ${v.vuelta} · ${v.pide_tools.length ? "pide " + esc(v.pide_tools.join(", ")) : "responde"} · ${v.reasoning_tokens} tokens de razonamiento</b>` +
        (v.resumen.length ? v.resumen.map(r => `<div>${esc(r)}</div>`).join("") : `<span class="vacio">${v.reasoning_tokens > 0 ? "Razonó " + v.reasoning_tokens + " tokens, pero el proveedor no devolvió resumen en esta llamada." : "Esta vuelta no razonó."}</span>`) + `</div>`).join("");
  } else {
    c.innerHTML = `<pre>${esc(JSON.stringify(ultimo.uso, null, 2))}</pre><p class="vacio">Costo con precios de ${esc(ultimo.modelo)}. Tokens de razonamiento: parte de los de salida que no se ve.</p>`;
  }
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); render(); });

function cuerpo(texto) {
  return { sesion_id: sesionId, texto, estrategia: $("#estrategia").value, diseno: $("#diseno").value, proveedor: $("#proveedor").value,
           side_effects: $("#side_effects").checked, effort: $("#effort").value, compresor: $("#compresor").value };
}
$("#entrada").onsubmit = async e => {
  e.preventDefault();
  const texto = $("#texto").value.trim(); if (!texto) return;
  $("#texto").value = ""; agregar("user", texto);
  const body = cuerpo(texto);
  if ($("#stream").checked) return enviarStream(body);
  const r = await fetch("/chat", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  ultimo = await r.json();
  if (ultimo.error) agregar("bot", "Error: " + ultimo.error); else agregar("bot", ultimo.respuesta, pie(ultimo));
  render();
};
// Streaming: la misma petición, pero la respuesta llega como eventos (SSE). El texto se escribe por deltas,
// las tools aparecen conforme se piden y, al final, llega el mismo JSON que /chat para pintar los paneles.
async function enviarStream(body) {
  const d = agregar("bot", "", "streaming…"); const meta = d.lastChild;
  const r = await fetch("/chat/stream", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "", texto = "", eventos = 0;
  while (true) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n\n")) >= 0) {
      const linea = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
      if (!linea.startsWith("data: ")) continue;
      const ev = JSON.parse(linea.slice(6)); eventos++;
      if (ev.tipo === "delta") { texto += ev.texto; d.firstChild.textContent = texto; }
      else if (ev.tipo === "item") { meta.textContent = ev.mensaje ? `${ev.mensaje}  (evento ${eventos}: ${ev.evento}${ev.nombre ? " " + ev.nombre : ""})` : `evento ${eventos}: ${ev.evento}${ev.nombre ? " " + ev.nombre : ""}`; }
      else if (ev.tipo === "final") {
        ultimo = ev;
        if (ev.error) { d.firstChild.textContent = "Error: " + ev.error; }
        else { d.firstChild.textContent = ev.respuesta; meta.textContent = `streaming (${eventos} eventos) · ` + pie(ev); }
        render();
      }
      $("#mensajes").scrollTop = 1e9;
    }
  }
}
$("#reiniciar").onclick = async () => { await fetch("/reiniciar?sesion_id=" + sesionId, { method: "POST" }); $("#mensajes").innerHTML = ""; ultimo = null; render(); };
</script>
</body>
</html>
